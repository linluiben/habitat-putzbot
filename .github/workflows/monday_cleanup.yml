name: Putzplan Automation

on:
  schedule:
    # GitHub Actions Cron läuft in UTC.
    # '0 8 * * 1' bedeutet: montags um 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Modus für diesen Lauf'
        type: choice
        options:
          - draw
          - plan
          - weekly
          - erledigt
        default: draw            # ⇦ Übergangsphase, siehe unten
      dry_run:
        description: 'Dry Run — nichts in Notion/Slack schreiben'
        type: boolean
        default: false
      debug:
        description: 'Debug — ausführliche Diagnose-Ausgaben'
        type: boolean
        default: false
      force_plan:
        description: 'Plan-Lauf erzwingen (auch außerhalb der letzten Zykluswoche)'
        type: boolean
        default: false

jobs:
  run-putzbot:
    runs-on: ubuntu-latest
    # Nicht gleichzeitig mit dem Poll-Workflow schreiben.
    concurrency:
      group: putzbot-schreibzugriff
      cancel-in-progress: false

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python tests.py

      # ── ÜBERGANGSPHASE bis einschließlich KW 36 (Mo 31.08.2026) ──────────
      # Planmäßig läuft nur `draw`: die laufende Woche auf 4 auffüllen und eine
      # Kanalnachricht posten — KEINE DMs und keine Zyklusplanung.
      #
      # Hintergrund: `weekly` lost selbst nie aus, es erinnert nur an bereits
      # Eingetragene. Solange kein Zyklus geplant ist, gäbe es für die Woche gar
      # keine Notion-Seite und der Lauf bliebe stumm.
      #
      # AB KW 37 (07.09.2026) auf 'weekly' zurückstellen — an beiden mit ⇦
      # markierten Stellen (hier und beim Input `modus` oben).
      # Davor einmalig Zyklus 10 planen: diesen Workflow von Hand mit
      # modus = plan starten. Das verschickt die ersten Auslos-DMs.
      # ─────────────────────────────────────────────────────────────────────
      - name: Skript ausführen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          DS_A_ID: ${{ secrets.DS_A_ID }}
          DS_B_ID: ${{ secrets.DS_B_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG: ${{ inputs.debug }}
          FORCE_PLAN: ${{ inputs.force_plan }}
        # Bei Cron-Läufen ist `inputs.modus` leer -> der feste Wert greift.
        run: python main.py ${{ inputs.modus || 'draw' }}   # ⇦
